<!DOCTYPE html>
<html>
<head>
    <title>Number Formatting Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        table {
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background: #333;
        }
        .category {
            font-weight: bold;
            background: #2a2a2a;
        }
    </style>
</head>
<body>
    <h1>Number Formatting Test</h1>

    <h2>Materials (0-100: one decimal, 100-100000: integer, >100000: k suffix)</h2>
    <table id="material-table">
        <tr>
            <th>Input</th>
            <th>Expected</th>
            <th>Actual</th>
            <th>Status</th>
        </tr>
    </table>

    <h2>Money (0-1: four decimals, 1-100000: two decimals, >100000: k suffix)</h2>
    <table id="money-table">
        <tr>
            <th>Input</th>
            <th>Expected</th>
            <th>Actual</th>
            <th>Status</th>
        </tr>
    </table>

    <script>
        // Copy the formatNumber function from main.js
        function formatNumber(value, type = 'material') {
            const num = typeof value === 'number' ? value : parseFloat(value);

            if (isNaN(num)) return '0';

            if (type === 'money' || type === 'gold') {
                // Money formatting
                if (num < 0) {
                    return '-' + formatNumber(Math.abs(num), type);
                }
                if (num < 1) {
                    return num.toFixed(4);
                }
                if (num <= 100000) {
                    return num.toFixed(2);
                }
                // > 100000: use k suffix
                return Math.round(num / 1000) + 'k';
            } else {
                // Material formatting (default)
                if (num < 0) {
                    return '-' + formatNumber(Math.abs(num), type);
                }
                if (num <= 100) {
                    return num.toFixed(1);
                }
                if (num <= 100000) {
                    return Math.round(num).toString();
                }
                // > 100000: use k suffix
                return Math.round(num / 1000) + 'k';
            }
        }

        // Test cases
        const materialTests = [
            { input: 0, expected: '0.0' },
            { input: 5.5, expected: '5.5' },
            { input: 90.1, expected: '90.1' },
            { input: 100, expected: '100.0' },
            { input: 100.9, expected: '101' },
            { input: 500, expected: '500' },
            { input: 95000, expected: '95000' },
            { input: 100000, expected: '100000' },
            { input: 100001, expected: '100k' },
            { input: 150000, expected: '150k' },
            { input: 950000, expected: '950k' },
            { input: 1500000, expected: '1500k' }
        ];

        const moneyTests = [
            { input: 0, expected: '0.0000' },
            { input: 0.0017, expected: '0.0017' },
            { input: 0.5, expected: '0.5000' },
            { input: 0.9999, expected: '0.9999' },
            { input: 1, expected: '1.00' },
            { input: 1.5, expected: '1.50' },
            { input: 100, expected: '100.00' },
            { input: 95123.14, expected: '95123.14' },
            { input: 100000, expected: '100000.00' },
            { input: 100001, expected: '100k' },
            { input: 150000, expected: '150k' },
            { input: 950000, expected: '950k' },
            { input: 1500000, expected: '1500k' }
        ];

        function runTests(tests, type, tableId) {
            const table = document.getElementById(tableId);
            tests.forEach(test => {
                const actual = formatNumber(test.input, type);
                const passed = actual === test.expected;
                const row = table.insertRow();
                row.innerHTML = `
                    <td>${test.input}</td>
                    <td>${test.expected}</td>
                    <td>${actual}</td>
                    <td style="color: ${passed ? '#4ade80' : '#ff6b6b'}">${passed ? '✓ PASS' : '✗ FAIL'}</td>
                `;
            });
        }

        runTests(materialTests, 'material', 'material-table');
        runTests(moneyTests, 'money', 'money-table');
    </script>
</body>
</html>
