<!-- Gems modal -->
<div id="gems-modal" class="modal" aria-hidden="true" role="dialog" aria-label="Gems dialog">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-dialog" role="document">
        <header class="modal-header">
            <h2>💎 Gems</h2>
            <button class="modal-close" aria-label="Close gems" data-action="close-modal">×</button>
        </header>
        <div class="modal-body">
            <div id="gems-content">
                <p>Your collection of precious gems discovered while digging.</p>
                <div id="gems-list" class="gems-list">
                    <!-- Gems will be populated here by JavaScript -->
                </div>
            </div>
        </div>
        <footer class="modal-footer">
            <button class="btn-secondary" data-action="close-modal">Close</button>
        </footer>
    </div>
</div>
