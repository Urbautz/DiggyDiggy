<!-- Masonry modal -->
<div id="masonry-modal" class="modal" aria-hidden="true" role="dialog" aria-label="Masonry dialog">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-dialog" role="document">
        <header class="modal-header">
            <h2>🔨 Masonry</h2>
            <button class="modal-close" aria-label="Close masonry" data-action="close-modal">×</button>
        </header>
        <div class="modal-body">
            <p>Process stones and materials!</p>
            <div id="masonry-content">
                <!-- Content will be added here -->
            </div>
        </div>
        <footer class="modal-footer">
            <button class="btn-secondary" data-action="close-modal">Close</button>
        </footer>
    </div>
</div>
