<!-- Research modal -->
<div id="research-modal" class="modal" aria-hidden="true" role="dialog" aria-label="Research dialog">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-dialog" role="document">
        <header class="modal-header">
            <h2>🔬 Research Lab</h2>
            <button class="modal-close" aria-label="Close research" data-action="close-modal">×</button>
        </header>
        <div class="modal-body">
            <p>Research new technologies to improve your operation!</p>
            <div class="research-options">
                <label>
                    <input type="checkbox" id="hide-endless-research">
                    Hide endless researches
                </label>
            </div>
            <div id="research-content">
                <!-- Content will be added here -->
            </div>
        </div>
        <footer class="modal-footer">
            <button class="btn-secondary" data-action="close-modal">Close</button>
        </footer>
    </div>
</div>
