<!-- Gem Setting modal -->
<div id="gem-modal" class="modal" aria-hidden="true" role="dialog" aria-label="Set Gems dialog">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-dialog" role="document">
        <header class="modal-header">
            <h2>💎 Set Gems</h2>
            <button class="modal-close" aria-label="Close gem setting" data-action="close-modal">×</button>
        </header>
        <div class="modal-body">
            <div id="gem-content">
                <!-- Content will be added here -->
            </div>
        </div>
        <footer class="modal-footer">
            <button class="btn-secondary" data-action="close-modal">Cancel</button>
            <button id="confirm-gem-btn" class="btn-primary">Confirm</button>
        </footer>
    </div>
</div>
