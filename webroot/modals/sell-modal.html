<!-- Sell Material modal -->
<div id="sell-modal" class="modal" aria-hidden="true" role="dialog" aria-label="Sell Material dialog">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-dialog" role="document">
        <header class="modal-header">
            <h2 id="sell-modal-title">💰 Sell Material</h2>
            <button class="modal-close" aria-label="Close sell" data-action="close-modal">×</button>
        </header>
        <div class="modal-body">
            <div id="sell-modal-content">
                <div class="sell-info">
                    <div class="sell-info-row">
                        <span class="sell-info-label">Available:</span>
                        <span id="sell-available" class="sell-info-value">0</span>
                    </div>
                    <div class="sell-info-row">
                        <span class="sell-info-label">Unit Price:</span>
                        <span id="sell-unit-price" class="sell-info-value">0</span>
                    </div>
                    <div class="sell-info-row">
                        <span class="sell-info-label">Trade Bonus:</span>
                        <span id="sell-trade-bonus" class="sell-info-value">+0%</span>
                    </div>
                </div>

                <div class="sell-slider-container">
                    <label for="sell-amount-slider" class="sell-slider-label">
                        Amount to sell: <span id="sell-amount-display">1</span>
                    </label>
                    <input type="range" id="sell-amount-slider" class="sell-slider" min="1" max="100" value="1" step="1">
                    <div class="sell-slider-marks">
                        <span>1</span>
                        <span id="sell-slider-max">100</span>
                    </div>
                </div>

                <div class="sell-total">
                    <span class="sell-total-label">Total Value:</span>
                    <span id="sell-total-value" class="sell-total-value">0 💰</span>
                </div>
            </div>
        </div>
        <footer class="modal-footer">
            <button id="sell-selected-btn" class="btn-primary">Sell</button>
            <button class="btn-secondary" data-action="close-modal">Cancel</button>
        </footer>
    </div>
</div>
